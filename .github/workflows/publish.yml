name: Publish Release & Sync npmmirror

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  sync-npmmirror:
    name: Sync to Domestic npmmirror
    runs-on: ubuntu-latest
    needs: [create-release, publish-npm]
    steps:
      - name: Trigger npmmirror sync
        run: |
          echo "Triggering npmmirror sync for agy-acp-bridge..."
          curl -s -X PUT https://registry-direct.npmmirror.com/agy-acp-bridge/sync || true
          echo "npmmirror sync triggered successfully!"
